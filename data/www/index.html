<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Remote Player</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  video{width:100%;height:100%;background:#000;object-fit:contain}
  #osd{position:fixed;left:16px;top:16px;padding:8px 14px;background:rgba(0,0,0,.65);border-radius:8px;
       opacity:0;transition:opacity .4s;pointer-events:none;max-width:80%;z-index:5}
  #osd.show{opacity:1}
  #dot{position:fixed;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:#c33;z-index:5}
  #dot.on{background:#3c3}
  #err{position:fixed;left:0;right:0;bottom:0;padding:10px;background:#a22;display:none;text-align:center;z-index:5}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
         background:#111;font-size:1.1rem;text-align:center;padding:20px;z-index:20}
  #start button{font-size:1.2rem;padding:14px 32px;border:0;border-radius:10px;background:#2a7;color:#fff;cursor:pointer}
</style>
</head>
<body>
<video id="v" playsinline controls></video>
<div id="osd"></div><div id="dot"></div><div id="err"></div>

<div id="start"><div>Remote Player<br><small id="st">Conectando con el control remoto…</small></div>
  <button id="go">Activar reproductor</button></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('v');
let hls = null, unlocked = false, pending = null, retries = 0;

function osd(t){ const o=$('osd'); o.textContent=t; o.classList.add('show'); clearTimeout(osd.t); osd.t=setTimeout(()=>o.classList.remove('show'),4000); }
function err(t){ const e=$('err'); e.textContent=t; e.style.display=t?'block':'none'; }
function nativePlay(url){ video.src = url; return video.play(); }

function play(ch){
  if (!unlocked){ pending = ch; return; }
  err(''); retries = 0; osd(ch.name + (ch.group ? '  ·  ' + ch.group : ''));
  if (hls){ hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({ enableWorker:true, lowLatencyMode:false });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR){
        if (++retries <= 3) { hls.startLoad(); return; }
        if (video.canPlayType('application/vnd.apple.mpegurl')){ hls.destroy(); hls=null; nativePlay(ch.url).catch(()=>{}); return; }
        err('No se pudo cargar el canal (red/CORS/stream caído).');
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
      else { err('Error fatal de reproducción.'); hls.destroy(); hls=null; }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    nativePlay(ch.url).catch(()=>{});
  } else {
    err('Este navegador no soporta HLS.');
  }
}

$('go').onclick = () => { unlocked = true; $('start').style.display='none'; if (pending){ play(pending); pending=null; } };

let ws, backoff = 500;
function connect(){
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen  = () => { backoff = 500; $('dot').classList.add('on'); $('st').textContent = 'Conectado. Esperando canal…'; };
  ws.onclose = () => { $('dot').classList.remove('on'); setTimeout(connect, backoff); backoff = Math.min(backoff*2, 8000); };
  ws.onmessage = e => {
    try { const m = JSON.parse(e.data); if (m.type === 'play' && m.url) play(m); } catch(_){}
  };
}
connect();
</script>
</body>
</html>
